---
layout: default
bodyClass: "page-home"
---

<section class="intro">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-12 col-md-7 col-lg-6 order-2 order-md-1">
        {{ content }}
      </div>
      <div class="col-12 col-md-5 col-lg-6 order-1 order-md-2 position-relative">
        <img alt="energy and data systems" class="intro-image" src="/images/teaser.png">
      </div>
    </div>
  </div>
</section>

<section class="strip strip-grey">
  <div class="container pt-6 pb-6 pt-md-10 pb-md-10">
    <h2 class="title">Research outcomes</h2>
    <div class="row justify-content-center">
      {% for feature in site.data.features %}
      <div class="col-12 col-md-6 col-lg-3 mb-2">
        <article class="feature">
          <h3 class="feature-title">{{ feature.title }}</h3>
          <div class="feature-content">{{ feature.description }}</div>
        </article>
      </div>
      {% endfor %}
    </div>
  </div>
</section>

<section class="strip">
  <div class="container pt-6 pb-6 pt-md-10 pb-md-10">
    <h2 class="title">Consortium</h2>
    <div class="row align-items-center justify-content-center">
      {% for partner in site.data.partners %}
      <div class="col-6 col-md-2 text-center mb-2">
        <a href="{{ partner.url }}" target="_blank" rel="noopener noreferrer">
          <img class="partner-logo" src="{{ '/images/universities/' | append: partner.logo | relative_url }}" alt="{{ partner.name }}" loading="lazy">
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
